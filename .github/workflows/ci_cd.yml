name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint Code with Flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Run Unit Tests with Pytest
      run: |
        python -m pytest -v

    - name: Execute Automated Data Acquisition & Model Training
      run: |
        PYTHONPATH=. python -m src/download_data.py
        PYTHONPATH=. python -m src/train.py

    - name: Archive MLflow Artifacts & Trained Model
      uses: actions/upload-artifact@v4
      with:
        name: trained-model-and-artifacts
        path: |
          models/
          screenshots/
          mlflow.db